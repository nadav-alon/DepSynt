# https://taskfile.dev

version: '3'

vars:
  GENERATED_BENCHMARK_PATH: ./tasks_output/generated_benchmarks

  STRIX_RESULTS_PATH: ./tasks_output/strix
  SPOT_MODULAR_RESULTS_PATH: ./tasks_output/spot_modular
  DEPSYNT_RESULTS_PATH: ./tasks_output/depsynt
  DEPSYNT_MEASURES_RESULTS_PATH: ./tasks_output/depsynt-measures

  STRIX_SUMMARY: ./tasks_output/strix.csv
  DEPSYNT_SUMMARY: ./tasks_output/depsynt.csv
  DEPSYNT_MEASURE_SUMMARY: ./tasks_output/depsynt_measure.csv
  SPOT_MODULAR_SUMMARY: ./tasks_output/spotmodular.csv

  SYNTHESIS_TIMEOUT: 180m
  BENCHMARKS_FAMALIES: "tsl_smart_home_jarvis/extracted-benchmarks,tsl_paper,mux,ltl2dpa,shift"

  FIND_DEPENDENCIES_FORMULA_PATH: ./tasks_output/find_deps_formula
  FIND_DEPENDENCIES_FORMULA_SUMMARY: ./tasks_output/find_deps_formula.csv

  FIND_DEPENDENCIES_PATH: ./tasks_output/find_deps
  FIND_DEPENDENCIES_SUMMARY: ./tasks_output/find_deps.csv
  FIND_DEPENDENCIES_TIMEOUT: 60m

  PDDL_BENCHMARKS_DIR: ./pddl-benchmarks/generated
  PDDL_RESULTS_PATH: ./tasks_output/pddl_synthesis
  PDDL_SUMMARY: ./tasks_output/pddl_synthesis.csv

  # HPC variables
  HPC_HOST: login
  HPC_REMOTE_DIR: work/DepSynt

  SLIPPERY_ENV: "(r1 & c1) & G(c1 & r -> X c2) & G(c2 & l -> X c1)"
  SLIPPERY_SYS: "G(l | r) & G(!(l & r)) & F c2"
  SLIPPERY_INS: "r1,c1,c2"
  SLIPPERY_OUTS: "l,r"

tasks:
  # Input Dependencies Synthesis
  inp_dep_synthesis:ultra_naive:
    desc: Build and run a test case for Input Dependencies Synthesis
    cmds:
      - make inp_dep_synthesis
      - ./inp_dep_synthesis -e '{{.SLIPPERY_ENV}}' -s '{{.SLIPPERY_SYS}}' --input '{{.SLIPPERY_INS}}' --output '{{.SLIPPERY_OUTS}}' --verbose --algorithm ultra_naive

  # Input Dependencies Synthesis
  inp_dep_synthesis:naive:
    desc: Build and run a test case for Input Dependencies Synthesis
    cmds:
      - make inp_dep_synthesis
      - ./inp_dep_synthesis -e '{{.SLIPPERY_ENV}}' -s '{{.SLIPPERY_SYS}}' --input '{{.SLIPPERY_INS}}' --output '{{.SLIPPERY_OUTS}}' --verbose --algorithm naive

  inp_dep_synthesis:naive_projected:
    desc: Build and run a test case for Input Dependencies Synthesis
    cmds:
      - make inp_dep_synthesis
      - ./inp_dep_synthesis -e '{{.SLIPPERY_ENV}}' -s '{{.SLIPPERY_SYS}}' --input '{{.SLIPPERY_INS}}' --output '{{.SLIPPERY_OUTS}}' --verbose --algorithm naive_projected

  # Synthesis
  depsynt:
    desc: Run DepSynt tool on the generated benchmarks
    summary: |
      This task removes the previous results and submits a new job to the cluster.
      The job is generated using the `slurm_task_gen.py` script with the args of:
      synthesis timeout, benchmarks text files path, the output directory to put the results on, what families of benchmark to run the results on.
    cmds:
      - mkdir -p {{.DEPSYNT_RESULTS_PATH}}
      - rm -f {{.DEPSYNT_RESULTS_PATH}}/*
      - rm -f ./submit_depsynt
      - chmod +x ./scripts/slurm_task_gen.py
      - ./scripts/slurm_task_gen.py --task=depsynt --timeout={{.SYNTHESIS_TIMEOUT}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --output-path={{.DEPSYNT_RESULTS_PATH}} --families="{{.BENCHMARKS_FAMALIES}}" > submit_depsynt
      - sbatch submit_depsynt

  # Synthesis
  depsynt:measure:
    desc: Run DepSynt tool with extra measures
    cmds:
      - mkdir -p {{.DEPSYNT_MEASURES_RESULTS_PATH}}
      - rm -f {{.DEPSYNT_MEASURES_RESULTS_PATH}}/*
      - rm -f ./submit_depsynt_measures
      - chmod +x ./scripts/slurm_task_gen.py
      - ./scripts/slurm_task_gen.py --task=depsynt_measured --timeout={{.SYNTHESIS_TIMEOUT}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --output-path={{.DEPSYNT_MEASURES_RESULTS_PATH}} --families="{{.BENCHMARKS_FAMALIES}}" > submit_depsynt_measures
      - sbatch submit_depsynt_measures

  depsynt:summary:
    cmds:
      - rm -f {{.DEPSYNT_SUMMARY}}
      - chmod +x ./scripts/results_summarizer.py
      - ./scripts/results_summarizer.py --result-path={{.DEPSYNT_RESULTS_PATH}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --summary-output={{.DEPSYNT_SUMMARY}} --tool=depsynt

  depsynt:measure:summary:
    cmds:
      - rm -f {{.DEPSYNT_MEASURE_SUMMARY}}
      - chmod +x ./scripts/results_summarizer.py
      - ./scripts/results_summarizer.py --result-path={{.DEPSYNT_MEASURES_RESULTS_PATH}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --summary-output={{.DEPSYNT_MEASURE_SUMMARY}} --tool=depsynt

  spot_modular:
    - mkdir -p {{.SPOT_MODULAR_RESULTS_PATH}}
    - rm -f {{.SPOT_MODULAR_RESULTS_PATH}}/*
    - rm -f ./submit_spot_modular
    - chmod +x ./scripts/slurm_task_gen.py
    - ./scripts/slurm_task_gen.py --task=spotmodular --timeout={{.SYNTHESIS_TIMEOUT}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --output-path={{.SPOT_MODULAR_RESULTS_PATH}} --families="{{.BENCHMARKS_FAMALIES}}" > submit_spot_modular
    - sbatch submit_spot_modular

  spot_modular:summary:
    cmds:
      - rm -f {{.SPOT_MODULAR_SUMMARY}}
      - chmod +x ./scripts/results_summarizer.py
      - ./scripts/results_summarizer.py --result-path={{.SPOT_MODULAR_RESULTS_PATH}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --summary-output={{.SPOT_MODULAR_SUMMARY}} --tool=depsynt

  cactus:
    desc: Generate Cactus Plot from the results of the synthesis
    cmds:
      - python -m scripts.generate_cactus

  strix:
    cmds:
      - mkdir -p {{.STRIX_RESULTS_PATH}}
      - rm -f {{.STRIX_RESULTS_PATH}}/*
      - rm -f ./submit_strix
      - chmod +x ./scripts/slurm_task_gen.py
      - ./scripts/slurm_task_gen.py --task=strix --timeout={{.SYNTHESIS_TIMEOUT}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --output-path={{.STRIX_RESULTS_PATH}} --families="{{.BENCHMARKS_FAMALIES}}" > submit_strix
      - sbatch submit_strix

  strix:summary:
    cmds:
      - rm -f {{.STRIX_SUMMARY}}
      - chmod +x ./scripts/results_summarizer.py
      - ./scripts/results_summarizer.py --result-path={{.STRIX_RESULTS_PATH}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --summary-output={{.STRIX_SUMMARY}} --tool=strix

  spot:summary: # Example: task spot:summary SPOT_RESULTS_PATH=./tasks_output/spot-lar SPOT_SUMMARY=./tasks_output/spot-lar.csv
    cmds:
      - rm -f {{.SPOT_SUMMARY}}
      - chmod +x ./scripts/results_summarizer.py
      - ./scripts/results_summarizer.py --result-path={{.SPOT_RESULTS_PATH}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --summary-output={{.SPOT_SUMMARY}} --tool=strix


  # Find Dependencies
  find_dependencies:
    cmds:
      - mkdir -p {{.FIND_DEPENDENCIES_PATH}}
      - rm -f {{.FIND_DEPENDENCIES_PATH}}/*
      - rm -f ./submit_find_deps
      - chmod +x ./scripts/slurm_task_gen.py
      - ./scripts/slurm_task_gen.py --task=find_deps --timeout={{.FIND_DEPENDENCIES_TIMEOUT}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --output-path={{.FIND_DEPENDENCIES_PATH}} > submit_find_deps
      - sbatch submit_find_deps

  # Find Input Dependencies
  find_input_deps:
    desc: Build and run slurm jobs to find input dependencies on HPC
    cmds:
      - mkdir -p {{.FIND_DEPENDENCIES_PATH}}
      - rm -f {{.FIND_DEPENDENCIES_PATH}}/*
      - rm -f ./submit_find_input_deps
      - chmod +x ./scripts/slurm_task_gen.py
      - ./scripts/slurm_task_gen.py --task=find_input_deps --timeout={{.FIND_DEPENDENCIES_TIMEOUT}} --benchmarks-path={{.BENCHMARKS_DIR}} --output-path={{.FIND_DEPENDENCIES_PATH}} > submit_find_input_deps
      - sbatch submit_find_input_deps
    vars:
       BENCHMARKS_DIR: '{{default (print .GENERATED_BENCHMARK_PATH "/text") .BENCHMARKS_DIR}}'
  bench:input_deps:
    desc: Build and report input dependencies for a set of benchmarks
    summary: |
      Runs the tool to find input dependencies on a specified list of benchmarks and outputs a readable report.
      Use `BENCHMARKS` variable to specify the path to the benchmarks (e.g. `task bench:input_deps BENCHMARKS=./tasks_output/generated_benchmarks/text`)
    cmds:
      - make find_input_dependencies
      - chmod +x ./scripts/input_dep_report.py
      - python3 ./scripts/input_dep_report.py {{.BENCHMARKS}} --tool ./find_input_dependencies

  bench:input_deps:test:
    desc: Run input dependency discovery on the verification test suite
    cmds:
      - task: bench:input_deps
        vars: { BENCHMARKS: "src/inputDependencies/benchmarks/input_deps_test_suite.json" }
    vars:
      BENCHMARKS: '{{default (print .GENERATED_BENCHMARK_PATH "/text") .BENCHMARKS}}'

  find_dependencies:summary:
    - rm -f {{.FIND_DEPENDENCIES_SUMMARY}}
    - chmod +x ./scripts/results_summarizer.py
    - ./scripts/results_summarizer.py --result-path={{.FIND_DEPENDENCIES_PATH}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --summary-output={{.FIND_DEPENDENCIES_SUMMARY}} --tool=find_deps


  find_dependencies_formula:
    cmds:
      - mkdir -p {{.FIND_DEPENDENCIES_FORMULA_PATH}}
      - rm -f {{.FIND_DEPENDENCIES_FORMULA_PATH}}/*
      - rm -f ./submit_find_deps
      - chmod +x ./scripts/slurm_task_gen.py
      - ./scripts/slurm_task_gen.py --task=find_deps_formula --timeout={{.FIND_DEPENDENCIES_TIMEOUT}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --output-path={{.FIND_DEPENDENCIES_FORMULA_PATH}} > submit_find_deps
      - sbatch submit_find_deps


  find_dependencies_formula:summary:
    - rm -f {{.FIND_DEPENDENCIES_FORMULA_SUMMARY}}
    - chmod +x ./scripts/results_summarizer.py
    - ./scripts/results_summarizer.py --result-path={{.FIND_DEPENDENCIES_FORMULA_PATH}} --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --summary-output={{.FIND_DEPENDENCIES_FORMULA_SUMMARY}} --tool=find_deps

  # Generate benchmarks
  generate_benchmarks:
    cmds:
      - task: generate_benchmarks:clean
      - task: generate_benchmarks:tlsf
      - task: generate_benchmarks:text

  generate_benchmarks:tlsf:
    internal: true
    cmds:
      - mkdir -p {{.GENERATED_BENCHMARK_PATH}}/tlsf
      - chmod +x ./scripts/benchmarks/tlsf/selectBenchmarks.py
      - ./scripts/benchmarks/tlsf/selectBenchmarks.py ./scripts/benchmarks/tlsf {{.GENERATED_BENCHMARK_PATH}}/tlsf --savestruct
  generate_benchmarks:clean:
    internal: true
    cmds:
      - rm -rf {{.GENERATED_BENCHMARK_PATH}}
      - mkdir -p {{.GENERATED_BENCHMARK_PATH}}
  generate_benchmarks:text:
    internal: true
    deps: [generate_benchmarks:tlsf]
    cmds:
      - rm -rf {{.GENERATED_BENCHMARK_PATH}}/text
      - mkdir -p {{.GENERATED_BENCHMARK_PATH}}/text
      - chmod +x ./scripts/tlsf_to_text.py
      - ./scripts/tlsf_to_text.py {{.GENERATED_BENCHMARK_PATH}}/tlsf {{.GENERATED_BENCHMARK_PATH}}/text

  # PDDL Benchmarks
  generate_pddl_benchmarks:
    desc: Generate PDDL benchmarks from fond-domains
    cmds:
      - mkdir -p {{.PDDL_BENCHMARKS_DIR}}
      - python3 ./scripts/pddl-benchmarks/generate_pddl_benchmarks.py

  depsynt:pddl:
    desc: Run DepSynt tool on PDDL benchmarks
    cmds:
      - mkdir -p {{.PDDL_RESULTS_PATH}}
      - rm -f {{.PDDL_RESULTS_PATH}}/*
      - rm -f ./submit_depsynt_pddl
      - chmod +x ./scripts/slurm_task_gen.py
      - ./scripts/slurm_task_gen.py --task=depsynt --timeout={{.SYNTHESIS_TIMEOUT}} --benchmarks-path={{.PDDL_BENCHMARKS_DIR}} --output-path={{.PDDL_RESULTS_PATH}} --families="pddl" > submit_depsynt_pddl
      - sbatch submit_depsynt_pddl

  depsynt:pddl:summary:
    cmds:
      - rm -f {{.PDDL_SUMMARY}}
      - chmod +x ./scripts/results_summarizer.py
      - ./scripts/results_summarizer.py --result-path={{.PDDL_RESULTS_PATH}} --benchmarks-path={{.PDDL_BENCHMARKS_DIR}} --summary-output={{.PDDL_SUMMARY}} --tool=depsynt

  inp_dep_synthesis:pddl:
    desc: Run inp_dep_synthesis tool on PDDL benchmarks
    cmds:
      - mkdir -p {{.PDDL_INP_DEP_RESULTS_PATH}}
      - rm -f {{.PDDL_INP_DEP_RESULTS_PATH}}/*
      - rm -f ./submit_inp_dep_pddl
      - chmod +x ./scripts/slurm_task_gen.py
      - ./scripts/slurm_task_gen.py --task=inp_dep_synthesis --timeout={{.SYNTHESIS_TIMEOUT}} --benchmarks-path={{.PDDL_BENCHMARKS_DIR}} --output-path={{.PDDL_INP_DEP_RESULTS_PATH}} --families="pddl" > submit_inp_dep_pddl
      - sbatch submit_inp_dep_pddl
    vars:
      PDDL_INP_DEP_RESULTS_PATH: ./tasks_output/pddl_inp_dep_synthesis

  inp_dep_synthesis:pddl:summary:
    cmds:
      - rm -f {{.PDDL_INP_DEP_SUMMARY}}
      - chmod +x ./scripts/results_summarizer.py
      - ./scripts/results_summarizer.py --result-path={{.PDDL_INP_DEP_RESULTS_PATH}} --benchmarks-path={{.PDDL_BENCHMARKS_DIR}} --summary-output={{.PDDL_INP_DEP_SUMMARY}} --tool=depsynt
    vars:
      PDDL_INP_DEP_RESULTS_PATH: ./tasks_output/pddl_inp_dep_synthesis
      PDDL_INP_DEP_SUMMARY: ./tasks_output/pddl_inp_dep_synthesis.csv

  find_input_deps:pddl:
    desc: Run find_input_deps tool on PDDL benchmarks
    cmds:
      - mkdir -p {{.PDDL_FIND_INPUT_DEPS_RESULTS_PATH}}
      - rm -f {{.PDDL_FIND_INPUT_DEPS_RESULTS_PATH}}/*
      - rm -f ./submit_find_input_deps_pddl
      - chmod +x ./scripts/slurm_task_gen.py
      - ./scripts/slurm_task_gen.py --task=find_input_deps --timeout={{.FIND_DEPENDENCIES_TIMEOUT}} --benchmarks-path={{.PDDL_BENCHMARKS_DIR}} --output-path={{.PDDL_FIND_INPUT_DEPS_RESULTS_PATH}} > submit_find_input_deps_pddl
      - sbatch submit_find_input_deps_pddl
    vars:
      PDDL_FIND_INPUT_DEPS_RESULTS_PATH: ./tasks_output/pddl_find_input_deps

  hpc:run:pddl:
    desc: Submit Slurm jobs for PDDL benchmarks on HPC
    cmds:
      - ssh {{.HPC_HOST}} "cd {{.HPC_REMOTE_DIR}} && ./.bin/task depsynt:pddl"

  hpc:run:pddl:inp_dep:
    desc: Submit Slurm jobs for inp_dep_synthesis on PDDL benchmarks on HPC
    cmds:
      - ssh {{.HPC_HOST}} "cd {{.HPC_REMOTE_DIR}} && ./.bin/task inp_dep_synthesis:pddl"

  hpc:run:pddl:find_input_deps:
    desc: Submit Slurm jobs for find_input_deps on PDDL benchmarks on HPC
    cmds:
      - ssh {{.HPC_HOST}} "cd {{.HPC_REMOTE_DIR}} && ./.bin/task find_input_deps:pddl"

  clean_skipped_synthesis:  # Example: task clean_skipped_synthesis CLEAN_PATH=./tasks_output/depsynt
    desc: Remove the skipped synthesis results
    summary: |
      Benchmarks may be skipped since it wasn't defined in the families of benchmarks to run on.
      The script `remove_skipped_synt.sh` removes the results of the synthesis that were skipped.
      The script takes as an argument the path to the results directory.
    cmds:
      - chmod +x ./scripts/remove_skipped_synt.sh
      - ./scripts/remove_skipped_synt.sh {{.CLEAN_PATH}}

  hpc:sync:
    desc: Sync local code and benchmarks to HPC via rsync
    cmds:
      - mkdir -p .bin && [ -f ./.bin/task ] || curl -sL https://taskfile.dev/install.sh | sh -s -- -b ./.bin
      - ssh {{.HPC_HOST}} "mkdir -p {{.HPC_REMOTE_DIR}}"
      - rsync -avz --exclude '.git' --exclude 'build/' --exclude 'tasks_output/' --exclude 'tasks_output_hpc/' --exclude 'fond-domains/' --exclude 'CMakeCache.txt' --exclude 'CMakeFiles/' --exclude 'cmake_install.cmake' --exclude 'Makefile' --exclude 'compile_commands.json' ./ {{.HPC_HOST}}:{{.HPC_REMOTE_DIR}}/

  hpc:build:
    desc: Build the project on HPC using sbatch hpc_build.sh
    cmds:
      - ssh {{.HPC_HOST}} "cd {{.HPC_REMOTE_DIR}} && chmod +x hpc_build.sh && sbatch hpc_build.sh"
      - task: hpc:monitor

  hpc:run:depsynt:
    desc: Submit Slurm jobs for depsynt on HPC
    cmds:
      - ssh {{.HPC_HOST}} "cd {{.HPC_REMOTE_DIR}} && ./.bin/task depsynt BENCHMARKS_FAMALIES='{{.BENCHMARKS_FAMALIES}}'"

  hpc:run:find_deps:
    desc: Submit Slurm jobs for find_dependencies on HPC
    cmds:
      - ssh {{.HPC_HOST}} "cd {{.HPC_REMOTE_DIR}} && ./.bin/task find_dependencies"

  hpc:run:find_input_deps:
    desc: Submit Slurm jobs for find_input_deps on HPC
    cmds:
      - ssh {{.HPC_HOST}} "cd {{.HPC_REMOTE_DIR}} && ./.bin/task find_input_deps BENCHMARKS_DIR='{{.BENCHMARKS_DIR}}'"

  hpc:monitor:
    desc: Polling squeue to check if jobs are still running
    cmds:
      - |
        echo "Monitoring Slurm jobs for user..."
        while ssh {{.HPC_HOST}} "squeue -u \$USER | grep -E 'depsynt|find_de|build_de|inp_dep' > /dev/null"; do
          echo "Jobs are still running. Checking again in 60 seconds..."
          sleep 60
        done
        echo "All Slurm jobs have finished."

  hpc:fetch:
    desc: Fetch benchmark results from HPC
    cmds:
      - mkdir -p ./tasks_output_hpc
      - rsync -avz {{.HPC_HOST}}:{{.HPC_REMOTE_DIR}}/tasks_output/ ./tasks_output_hpc/
      - echo "Results fetched to ./tasks_output_hpc"

  hpc:summary:
    desc: Aggregate JSON results from HPC into summary CSVs for all tools
    cmds:
      - chmod +x ./scripts/results_summarizer.py
      - |
        for tool in depsynt strix spotmodular find_deps; do
          if [ -d "./tasks_output_hpc/$tool" ]; then
            echo "Summarizing $tool..."
            ./scripts/results_summarizer.py --result-path=./tasks_output_hpc/$tool --benchmarks-path={{.GENERATED_BENCHMARK_PATH}}/text --summary-output=./tasks_output_hpc/$tool.csv --tool=$tool
          fi
        done

  hpc:cactus:
    desc: Generate Cactus Plot from the HPC results
    cmds:
      - task: hpc:summary
      - |
        echo "Preparing HPC results for Cactus plot..."
        mkdir -p ./tasks_output
        cp ./tasks_output_hpc/*.csv ./tasks_output/
        python3 -m scripts.generate_cactus
        echo "Cactus plot generated (likely as cactus-*.png)"

  hpc:visualize:
    desc: Open the visualization notebook or plots
    cmds:
      - task: hpc:cactus
      - echo "You can now open scripts/visualization.ipynb or view the generated .png plots."

  hpc:full_run:
    desc: Complete HPC workflow (Sync -> Build -> Run -> Monitor -> Fetch -> Summary -> Visualize)
    cmds:
      - task: hpc:sync
      - task: hpc:build
      - task: hpc:run:depsynt
      - task: hpc:monitor
      - task: hpc:fetch
      - task: hpc:visualize

  verify_algorithms:
    desc: Verify input dependencies algorithms using the benchmark suite
    cmds:
      - make inp_dep_synthesis
      - python3 src/inputDependencies/verify_algorithms.py

  hpc:verify_strategy:
    desc: Verify HPC strategy with a single benchmark family (mux)
    cmds:
      - task: hpc:sync
      - task: hpc:build
      - task: hpc:run:depsynt
        vars: { BENCHMARKS_FAMALIES: "mux" }
      - task: hpc:monitor
      - task: hpc:fetch
      - task: hpc:visualize

